[package]
name = "lithe"
version = "0.3.0"
edition = "2021"
description = "Lithe, a smart-contract language for the EVM"
license = "Apache-2.0"

[dependencies]
logos = "0.15"

# The compiler allocates many small, short-lived vectors on every thread; the system allocator
# spends a fifth of a cold compile on them. Not for WebAssembly, which the playground builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[[bin]]
name = "lithe"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The optimizer passes are too slow to run unoptimized: debug builds take minutes per contract.
[profile.dev]
opt-level = 2

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
