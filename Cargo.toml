[package]
name = "lithe"
version = "0.1.0"
edition = "2021"
description = "Lithe, a functional state-transition language for the EVM"
license = "MIT"

[dependencies]
logos = "0.15"

[[bin]]
name = "lithe"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The optimizer passes are too slow to run unoptimized: debug builds take minutes per contract.
[profile.dev]
opt-level = 2

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
