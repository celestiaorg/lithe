name: Publish @lithe-lang/hardhat

# Pushing a tag `hardhat-v<version>` stages that version of extensions/hardhat, which must
# be the version in its package.json, and a maintainer approves it on npmjs.com, or with
# `npm stage approve`, to publish it. npm trusts this workflow by its file name, so renaming
# the file means updating the package's trusted publisher on npmjs.com.
on:
  push:
    tags: ["hardhat-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    defaults:
      run:
        working-directory: extensions/hardhat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "hardhat-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
      - run: cargo build --release --locked
        working-directory: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - run: npm ci
      - run: PATH="$GITHUB_WORKSPACE/target/release:$PATH" npm test
      # Staged publishing needs npm 11.15.0 or later. It is installed only now because npm 12
      # refuses the git dependency (forge-std) that the tests install.
      - run: npm install -g npm@12.2.0 # zizmor: ignore[adhoc-packages]
      - run: npm stage publish
